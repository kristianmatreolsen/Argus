name: Build & Release Argus Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore Argus.sln

    # Tag builds use the tag as version (v1.2.0 -> 1.2.0); other builds are marked as CI builds.
    - name: Determine Version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
        else { $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
        "ARGUS_VERSION=$version" >> $env:GITHUB_ENV

    - name: Build and Publish Standalone Executable
      shell: pwsh
      run: |
        dotnet publish src/Argus/Argus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$env:ARGUS_VERSION -o publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Argus-Standalone-Executable
        path: |
          publish/Argus.exe
          THIRD-PARTY-NOTICES.md

    - name: Create Release (Tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/Argus.exe
          THIRD-PARTY-NOTICES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
