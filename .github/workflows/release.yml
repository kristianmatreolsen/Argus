name: Build & Release Argus Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore Argus.sln

    - name: Build and Publish Standalone Executable
      run: |
        dotnet publish src/Argus/Argus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Argus-Standalone-Executable
        path: publish/Argus.exe

    - name: Create Release (Tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: publish/Argus.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
